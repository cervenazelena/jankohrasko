# /etc/nginx/sites-available/janko  (symlink do sites-enabled/, default site vypnúť)
# Verejný frontend: :80 → autossh tunel 127.0.0.1:8200 → agent na Perune.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;              # upload príloh (agent sám odmietne > 5 MB)

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # agent loguje reálnu IP klienta
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;               # SSE streaming (/agent/stream)
        proxy_cache off;
        proxy_read_timeout 3600s;          # agent s nástrojmi môže bežať minúty
        proxy_send_timeout 3600s;
    }
}
